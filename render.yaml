services:
  # 1. FastAPI Backend API
  - type: web
    name: schnell-dashboard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schnell-dashboard-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"

  # 2. React / Vite Frontend UI
  - type: web
    name: schnell-dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: schnell-dashboard-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database
  - name: schnell-dashboard-db
    databaseName: schnell_dashboard
    user: schnell_user
    plan: free
